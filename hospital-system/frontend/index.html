<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso Administrativo - Sistema Hospitalar Híbrido</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-body">
    <div class="login-card">
        <div class="login-logo">🏥</div>
        <h1>Portal Hospitalar</h1>
        <p>Acesso exclusivo para administradores e equipe médica.</p>
        
        <form id="login-form">
            <div class="form-group" style="text-align: left;">
                <label for="password">Senha do Sistema</label>
                <input type="password" id="password" class="form-control" placeholder="••••" required autofocus style="text-align: center; font-size: 1.2rem; letter-spacing: 4px;">
            </div>
            
            <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; margin-top: 1rem; padding: 0.85rem;">
                Entrar no Sistema ➡️
            </button>
        </form>
    </div>

    <script src="js/app.js"></script>
    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const password = document.getElementById('password').value;
            
            try {
                const res = await API.post('/api/login', { password });
                if (res.success) {
                    localStorage.setItem('adminToken', res.token);
                    window.location.href = 'dashboard.html';
                }
            } catch (err) {
                // Erros já alertados pelo helper API
                document.getElementById('password').value = '';
            }
        });
    </script>
</body>
</html>
